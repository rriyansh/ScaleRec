app:
  name: "ScaleRec"
  version: "0.2.0"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  num_users: 50
  num_items: 100
  num_interactions: 500
  user_feat_dim: 4
  item_feat_dim: 4
  seed: 42

model:
  embedding_dim: 8
  hidden_dim: 16
  temperature: 0.07
  dropout: 0.0

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 1
  weight_decay: 0.0

faiss:
  index_type: "FlatIP"
  nlist: 10
  m: 4
  nbits: 4
  nprobe: 5

ranking:
  n_candidates: 10
  top_k: 5
  xgb_params:
    n_estimators: 5
    max_depth: 2
    learning_rate: 0.1
    objective: "binary:logistic"
    eval_metric: "auc"

serving:
  host: "127.0.0.1"
  port: 8000
  workers: 1
  request_timeout: 5.0
  max_batch_size: 10
  cors_origins: ["*"]
  rate_limit_per_minute: 1000
  max_request_bytes: 1048576
  include_docs: true
